workshop:
  name: Northside Garage
  bays: 4
  token-ttl: 5m
  telematics:
    url: https://oem-portal.example.com/telematics
  max-grants: 8
  oem-portal:
    url: https://oem-portal.example.com/workshop-keys
    api-key: demo-portal-key-7f3a
  mechanics:
    - id: M-001
      name: Anna Nowak
      certification: master
    - id: M-002
      name: Piotr Zielinski
      certification: TECHNICIAN
    - id: M-003
      name: Ola Wisniewska
      certification: apprentice
  vehicles:
    - vin: WVWZZZ1KZ6W000001
      model: Golf
      modules:
        - id: engine
          kind: engine
          faults:
            - P0301
            - P0420
        - id: abs
          kind: brakes
          faults:
            - C0035
        - id: immobilizer
          kind: immobilizer
    - vin: TMBJJ7NE8J0000002
      model: Octavia
      modules:
        - id: engine
          kind: engine
        - id: abs
          kind: brakes

coilix:
  events:
    listeners:
      staffNotifications:
        onInspectionFinished:
          retry:
            max-attempts: 3
            initial-delay: 200ms
  boot:
    startup-message-formatter:
      class: dev.coilix.demo.PrefixedStartupMessageFormatter
      prefix: "[workshop]"
      delegate:
        class: dev.coilix.boot.DefaultStartupMessageFormatter
