name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: 12_docs/website/.nvmrc
      - name: Check tag, branch and changelog
        id: tag
        run: node 12_docs/website/scripts/release-tag.mjs "$GITHUB_REF_NAME" release-notes.md >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Verify the modules of the group
        run: sbt "releaseVerify ${{ steps.tag.outputs.group }} ${{ steps.tag.outputs.version }}"
      - name: Publish the modules of the group
        run: sbt ci-release
        env:
          RELEASE_GROUP: ${{ steps.tag.outputs.group }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.tag.outputs.title }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          prerelease=""
          if [ "$PRERELEASE" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$TITLE" --notes-file release-notes.md $prerelease
