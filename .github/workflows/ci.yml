name: CI

on:
  push:
    branches: [master, "series/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# sbt runs with --server: the sbt 2 runner defaults to the thin client, which cannot take several commands in one call
# and gives up when the server needs more than 300 s to start. bash with pipefail keeps the exit code of sbt behind tee.
#
# Caching never skips a test: every job that builds runs testFull. The steps are skipped only in a pull request that
# changes nothing but files no build step reads (.github/scripts/needs-build.sh). Each job still runs and reports its check,
# so the required checks stay the same. The sbt 2 disk cache holds compiled classes keyed by the hash of their inputs; it is
# saved after every push to master and restored by pull requests (ADR 0023).
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Formatting, licenses and binary compatibility do not depend on the JDK, and releases are verified on JDK 17.
          - java: 17
            tasks: checkFormat; checkLicenses; testFull; mimaReportBinaryIssues; doc
          - java: 25
            tasks: testFull; doc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: changes
        run: .github/scripts/needs-build.sh build
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
        if: steps.changes.outputs.run == 'true'
        with:
          disk-cache: false
      - name: Restore the sbt disk cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sbt
          key: sbt-disk-${{ runner.os }}-java${{ matrix.java }}-${{ github.sha }}
          restore-keys: sbt-disk-${{ runner.os }}-java${{ matrix.java }}-
      - name: Check, test and generate API documentation
        if: steps.changes.outputs.run == 'true'
        run: |
          sbt --server "${{ matrix.tasks }}" 2>&1 | tee build.log
          if grep -q "Couldn't resolve a member for the given link query" build.log; then
            echo "::error::Scaladoc contains broken links"
            exit 1
          fi
          if grep -q "warnings found and -Werror specified" build.log; then
            echo "::error::Javadoc has errors or missing comments"
            exit 1
          fi
      - name: Save the sbt disk cache
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/sbt
          key: sbt-disk-${{ runner.os }}-java${{ matrix.java }}-${{ github.sha }}

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: 99_docs/website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: changes
        working-directory: .
        run: .github/scripts/needs-build.sh site
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
        if: steps.changes.outputs.run == 'true'
        with:
          disk-cache: false
      - name: Restore the sbt disk cache
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sbt
          key: sbt-disk-${{ runner.os }}-java17-${{ github.sha }}
          restore-keys: sbt-disk-${{ runner.os }}-java17-
      - name: Compile examples and build API documentation
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: |
          sbt --server docs/testFull docs/apiSite 2>&1 | tee doc.log
          if grep -q "Couldn't resolve a member for the given link query" doc.log; then
            echo "::error::Scaladoc contains broken links"
            exit 1
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run == 'true'
        with:
          node-version-file: 99_docs/website/.nvmrc
          cache: npm
          cache-dependency-path: 99_docs/website/package-lock.json
      - name: Install site dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci
      - name: Test site scripts
        if: steps.changes.outputs.run == 'true'
        run: npm test
      - name: Check pages, changelog and npm licenses
        if: steps.changes.outputs.run == 'true'
        run: npm run check
      - name: Build site
        if: steps.changes.outputs.run == 'true'
        run: npm run build

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Decide whether to build
        id: changes
        run: .github/scripts/needs-build.sh build
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
        if: steps.changes.outputs.run == 'true'
        with:
          disk-cache: false
      # No disk cache here: it restores instrumented classes without their scoverage-data directories.
      - name: Test with coverage
        if: steps.changes.outputs.run == 'true'
        run: sbt --server --sbt-cache "$RUNNER_TEMP/sbt-cache-coverage" testCoverage
      - name: Upload coverage report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/out/jvm/scala-*/coilix/scoverage-report/
