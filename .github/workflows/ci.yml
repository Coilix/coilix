name: CI

on:
  push:
    branches: [master, "series/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 25]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt checkFormat
      - name: Check dependency licenses
        run: sbt checkLicenses
      - name: Test
        run: sbt testFull
      - name: Check binary compatibility
        run: sbt mimaReportBinaryIssues
      - name: Generate API documentation
        run: |
          sbt doc 2>&1 | tee doc.log
          if grep -q "Couldn't resolve a member for the given link query" doc.log; then
            echo "::error::Scaladoc contains broken links"
            exit 1
          fi
          if grep -q "warnings found and -Werror specified" doc.log; then
            echo "::error::Javadoc has errors or missing comments"
            exit 1
          fi

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 12_docs/website
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Compile examples and build API documentation
        working-directory: .
        run: |
          sbt docs/testFull docs/apiSite 2>&1 | tee doc.log
          if grep -q "Couldn't resolve a member for the given link query" doc.log; then
            echo "::error::Scaladoc contains broken links"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: 12_docs/website/.nvmrc
          cache: npm
          cache-dependency-path: 12_docs/website/package-lock.json
      - name: Install site dependencies
        run: npm ci
      - name: Check pages and npm licenses
        run: npm run check
      - name: Build site
        run: npm run build

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
        with:
          disk-cache: false
      - name: Test with coverage
        run: sbt --sbt-cache "$RUNNER_TEMP/sbt-cache-coverage" testCoverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/out/jvm/scala-*/coilix/scoverage-report/
