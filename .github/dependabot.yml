version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "COILIX-00000:"
    labels:
      - dependencies
  - package-ecosystem: npm
    directory: /12_docs/website
    schedule:
      interval: weekly
    commit-message:
      prefix: "COILIX-00000:"
    labels:
      - dependencies
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
